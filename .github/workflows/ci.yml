name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mkdir -p artifacts
      - run: pytest --junitxml=artifacts/pytest.xml
      - run: siqoq scenario run --config examples/scenario.json > artifacts/scenario-summary.json
      - run: cp scenario-events.jsonl artifacts/scenario-events.jsonl
      - run: python -m build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siqoq-simulation-evidence
          path: artifacts/

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      # Build both architectures via QEMU emulation on the amd64 runner.
      # Not pushed: no registry credential is configured in this repo.
      - run: docker buildx build --platform linux/amd64,linux/arm64 -t siqoq:ci .
      # Load only the amd64 image locally to smoke-test `siqoq demo`.
      # arm64 is build-only/QEMU-emulated here, not run-tested on real hardware.
      - run: docker buildx build --platform linux/amd64 --load -t siqoq:amd64 .
      - run: docker run --rm siqoq:amd64 demo
