name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mkdir -p artifacts
      - run: pytest --junitxml=artifacts/pytest.xml
      - run: siqoq scenario run --config examples/scenario.json > artifacts/scenario-summary.json
      - run: cp scenario-events.jsonl artifacts/scenario-events.jsonl
      - run: python -m build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siqoq-simulation-evidence
          path: artifacts/
