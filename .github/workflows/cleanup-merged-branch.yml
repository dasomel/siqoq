name: Cleanup merged branch

on:
  pull_request:
    types: [closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  delete-merged-head:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged head ref
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          encoded_ref="$(python3 - <<'PY'
          import os
          import urllib.parse
          print(urllib.parse.quote(os.environ['HEAD_REF'], safe=''))
          PY
          )"
          status="$(curl --silent --show-error --output /tmp/delete-ref-response.json \
            --write-out '%{http_code}' \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/git/refs/heads/${encoded_ref}")"
          # A branch deleted by another actor first (e.g. `gh pr merge --delete-branch`)
          # races this workflow; GitHub then reports 422/404 for the already-gone ref.
          # Treat that as success rather than failing a merge-time cleanup job on it.
          if [ "$status" = "204" ]; then
            echo "Deleted ref refs/heads/${HEAD_REF}"
          elif [ "$status" = "422" ] || [ "$status" = "404" ]; then
            echo "Ref refs/heads/${HEAD_REF} already gone (HTTP ${status}); nothing to do."
          else
            echo "Unexpected response deleting refs/heads/${HEAD_REF} (HTTP ${status}):" >&2
            cat /tmp/delete-ref-response.json >&2
            exit 1
          fi
